name: ishi
description: "A Roguelike Card Game Made with Flutter."
publish_to: "none"
version: 0.11.4+1

environment:
    sdk: ^3.11.3

dependencies:
    audioplayers: ^6.6.0
    flutter:
        sdk: flutter
    flutter_animate: ^4.5.2
    flutter_webrtc: ^1.4.1
    mobile_scanner: ^7.2.0
    package_info_plus: ^10.1.0
    qr_flutter: ^4.1.0
    shared_preferences: ^2.5.5
    supabase_flutter: ^2.12.4
    uuid: ^4.5.3

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4

flutter:
    uses-material-design: true
    assets:
        - assets/
        - assets/images/
        - assets/audio/
        - assets/audio/sfx/
        - assets/audio/music/
