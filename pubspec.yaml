name: ishi
description: "A Rogulike Card Game Made with Flutter."
publish_to: "none"
version: 0.8.1+1

environment:
    sdk: ^3.11.3

dependencies:
    flutter:
        sdk: flutter
    flutter_webrtc: ^1.4.1
    mobile_scanner: ^7.2.0
    package_info_plus: ^10.1.0
    qr_flutter: ^4.1.0
    shared_preferences: ^2.5.5
    supabase_flutter: ^2.12.4
    uuid: ^4.5.3

dev_dependencies:
    flutter_test:
        sdk: flutter
    flutter_lints: ^6.0.0
    flutter_launcher_icons: ^0.14.4

flutter:
    uses-material-design: true
    assets:
        - assets/
        - assets/images/
